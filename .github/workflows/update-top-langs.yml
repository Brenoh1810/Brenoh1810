name: Update top languages

on:
  schedule:
    - cron: "17 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: Brenoh1810
        run: python scripts/generate_top_langs.py

      - name: Commit if the card changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/top-langs.svg
          if git diff --staged --quiet; then
            echo "No language stats changes"
          else
            git commit -m "Update top languages card"
            git push
          fi
